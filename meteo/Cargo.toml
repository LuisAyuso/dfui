[package]
name = "meteo"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
dfui.workspace = true
dfui-map = { path = "../map" }
serde_json = "1"
flate2 = "1"
ureq = "3.5"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
log = "0.4"

[package.metadata.android]
package = "dev.dfui.meteo"
build_targets = ["aarch64-linux-android"]
# Icon foreground rendered from assets/icon.svg: rsvg-convert -w 432 -h 432.
resources = "res"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "Meteo"
icon = "@mipmap/ic_launcher"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"
