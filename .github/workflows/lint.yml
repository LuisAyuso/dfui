name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: aarch64-linux-android, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The Android and web runtimes are behind cfg, so the host pass never sees them.
      - run: cargo clippy -p dfui --target aarch64-linux-android --locked -- -D warnings
      - run: cargo clippy -p dfui --target wasm32-unknown-unknown --locked -- -D warnings

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Broken intra-doc links and malformed docs fail here before docs.rs sees them.
      - run: cargo doc --no-deps -p dfui --locked
        env:
          RUSTDOCFLAGS: -D warnings
