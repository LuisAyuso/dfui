# Publishes dfui and its sibling crates to crates.io when a `v*` tag is pushed, after the tests pass.
# Needs a CARGO_REGISTRY_TOKEN repository secret.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Publishing builds dfui-media (ALSA, FFmpeg) and dfui-bevy (udev, Wayland, xkbcommon).
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libavcodec-dev libavutil-dev libclang-dev libudev-dev libwayland-dev libxkbcommon-dev
      - name: Tag matches the crate version
        run: test "${GITHUB_REF_NAME#v}" = "$(cargo pkgid -p dfui | sed 's/.*[#@]//')"
      - run: cargo publish -p dfui -p dfui-map -p dfui-media -p dfui-bevy -p dfui-plot --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
