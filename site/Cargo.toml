[package]
name = "dfui-site"
version = "0.1.0"
edition = "2024"
license = "WTFPL"

# Each examples/<name>.rs is a standalone program, built to its own wasm and
# embedded in its widget's page under the text of <name>.md; dfui's docs show
# the same code as doc tests. `src/main.rs` generates the pages.

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[dev-dependencies]
dfui = { path = ".." }
futures-util = { version = "0.3", default-features = false }
