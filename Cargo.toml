[package]
name = "dfui"
version = "0.1.0"
edition = "2024"
license = "WTFPL"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
futures-core = "0.3"
harfrust = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4.34"
pollster = "1.0.1"
read-fonts = "0.46"
taffy = "0.15"
unicode-segmentation = "1.13"
web-time = "1.1"
winit = { version = "0.30", features = ["android-native-activity"] }

[[bench]]
name = "cpu"
harness = false

[[bench]]
name = "gpu"
harness = false

[workspace]
members = ["demo", "site"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = "30"

# WebGPU only: the other backends would just add size to the wasm.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "webgpu", "wgsl"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"

[target.'cfg(not(any(target_os = "android", target_arch = "wasm32")))'.dependencies]
arboard = { version = "3.7", default-features = false }

[dev-dependencies]
criterion = "0.8"

# Small wasm for the docs site's examples.
[profile.web]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
