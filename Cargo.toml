[package]
name = "dfui"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4.34"
pollster = "1.0.1"
taffy = "0.15"
ttf-parser = "0.25"
wgpu = "30"
winit = { version = "0.30", features = ["android-native-activity"] }

[workspace]
members = ["demo"]

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
