[package]
name = "dfui-map"
version.workspace = true
edition = "2024"
license = "MIT"
description = "Pannable, zoomable vector map widget for dfui"
repository = "https://github.com/LuisAyuso/dfui"
readme = "README.md"
keywords = ["map", "openstreetmap", "gui", "dfui"]
categories = ["gui", "rendering"]
# The examples need OpenStreetMap data at build time.
include = ["src/**", "README.md"]

[dependencies]
dfui.workspace = true

# Downloading and parsing OpenStreetMap data is the app's job.
[dev-dependencies]
serde_json = "1"

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dev-dependencies]
ureq = "3.5"

[target.'cfg(target_os = "android")'.dev-dependencies]
android_logger = "0.15"
log = "0.4"

[[example]]
name = "osm_android"
crate-type = ["cdylib"]

[package.metadata.android]
package = "dev.dfui.map"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "dfui map"
