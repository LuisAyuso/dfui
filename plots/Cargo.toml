[package]
name = "dfui-plots"
version.workspace = true
edition = "2024"
license = "MIT"
description = "Experimental ggplot-style plot widgets for dfui"
repository = "https://github.com/LuisAyuso/dfui"
readme = "README.md"
keywords = ["plot", "chart", "gui", "dfui"]
categories = ["gui", "visualization"]
include = ["src/**", "README.md"]

[dependencies]
dfui.workspace = true

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
